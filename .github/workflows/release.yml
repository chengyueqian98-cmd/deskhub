# 推一个 v 开头的标签（比如 git tag v0.4.0 && git push --tags），GitHub 就会自动跑测试、编译、出安装包、发到 Releases。
# 公开仓库用 GitHub 的 macOS 机器是免费的。
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./test.sh
      - name: Build DMG
        run: ./scripts/make-dmg.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/DeskHub-*.dmg
          generate_release_notes: true
